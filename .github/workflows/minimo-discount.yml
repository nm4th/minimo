name: minimo-discount

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'set | remove'
        required: true
        default: 'set'
        type: choice
        options:
          - set
          - remove
      menu:
        description: '(test) substring of menu name to limit to a single menu (e.g. 人気No.2)'
        required: false
        default: ''
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run
        env:
          MINIMO_SALON_ID:    ${{ secrets.MINIMO_SALON_ID }}
          MINIMO_PASSWORD:    ${{ secrets.MINIMO_PASSWORD }}
          MINIMO_STAFF_HASH:  ${{ secrets.MINIMO_STAFF_HASH }}
          ACTION:             ${{ inputs.action }}
          MENU_FILTER:        ${{ inputs.menu }}
        run: timeout 300 python minimo_discount.py "$ACTION"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'
          if-no-files-found: ignore
